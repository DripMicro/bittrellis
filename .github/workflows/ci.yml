name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests (synthetic checkpoints, no GPU)
        run: python -m pytest -q
      - name: Shell scripts parse
        run: for f in scripts/*.sh experiments/feasibility/*.sh; do bash -n "$f"; done
      - name: README visuals match manifests and results
        run: |
          python scripts/render_readme_assets.py
          git diff --exit-code docs/assets
      - name: Track, corpus and manifests are consistent
        run: |
          bittrellis track > /dev/null
          bittrellis corpus verify
          bittrellis manifest experiments/feasibility/variants/*.yaml
          for m in manifests/*.yaml; do [ -e "$m" ] || continue; bittrellis manifest "$m" --against manifests/ || exit 1; done
          bittrellis --track HPC-02 manifest experiments/hpc02/*.yaml
          for m in manifests/hpc02/*.yaml; do [ -e "$m" ] || continue; bittrellis --track HPC-02 manifest "$m" || exit 1; done

  llamacpp-tool:
    # Proves tools/llamacpp_score.cpp still compiles against the pinned llama.cpp headers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned llama.cpp headers
        run: |
          COMMIT=$(python3 -c "import yaml;print(yaml.safe_load(open('configs/hpc01.yaml'))['external_references']['R2']['llama_cpp_commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout "$COMMIT" -- include ggml/include
      - name: Compile (syntax + API)
        run: g++ -std=c++17 -fsyntax-only -I /tmp/llama.cpp/include -I /tmp/llama.cpp/ggml/include tools/llamacpp_score.cpp
