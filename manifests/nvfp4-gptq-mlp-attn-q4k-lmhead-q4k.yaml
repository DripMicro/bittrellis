schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-attn-q4k-lmhead-q4k
description: >
  #91 (attention on runtime Q4_K over the nvfp4_blockfit map, lm_head fitted once: RP-KL 0.0909,
  decode 94.9, prefill 15.8K, peak 21.85 GiB) with every MLP block on nvfp4_gptq. The same change on #86's map,
  which also runs attention on Q4_K, lowered drift by 0.0104 at identical speed and memory (#104). Formats and
  kernels are #91's, so this should be the lowest drift above 15K prefill and 94 tok/s decode.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: Q4_K
modules:
  lm_head: Q4_K
