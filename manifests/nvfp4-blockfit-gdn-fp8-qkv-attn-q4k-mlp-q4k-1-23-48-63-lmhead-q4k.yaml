schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-blockfit-gdn-fp8-qkv-attn-q4k-mlp-q4k-1-23-48-63-lmhead-q4k
description: >
  #93 (FP8 recurrent qkv 1-63, attention on runtime Q4_K, nvfp4_blockfit on every other NVFP4 projection,
  lm_head fitted once: RP-KL 0.0743, the lowest drift on the frontier, at 22.68 GiB) with runtime Q4_K on MLP
  layers 1-23 and 48-63. On #86's map, Q4_K on MLP 24-47 cost 0.0039 of drift (#90) while Q4_K on all of MLP
  1-63 cost 0.0041 (#87): nearly all of the MLP Q4_K drift sits in layers 24-47, and the other 39 layers trade
  NVFP4 for Q4_K almost free, saving about 0.018 GiB each (#86 to #87). Keeping MLP 24-47 and layer 0 on
  blockfit bytes should hold drift near #93's at about 0.7 GiB less peak memory, a point no frontier map
  covers (every map under 22 GiB drifts 0.0858 or more); the price is prefill, as on #87.
authors: [lourincedaging0-commits]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.mlp"
    layers: "1-23,48-63"
    format: Q4_K
modules:
  lm_head: Q4_K
