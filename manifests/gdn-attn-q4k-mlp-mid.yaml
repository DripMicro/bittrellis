schema: bittrellis/manifest@2
track: HPC-01
name: gdn-attn-q4k-mlp-mid
description: Q4_K on recurrent and attention weights with a mid-layer MLP window.
authors:
- dato-bitar
default: NVFP4
rules:
- match: L*.gdn.*
  layers: 1-63
  format: Q4_K
- match: L*.mlp
  layers: 24-47
  format: Q4_K
- match: L*.attn.*
  layers: 3-63
  format: Q4_K
