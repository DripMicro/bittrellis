schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-gdn-fp8-state-lmhead-q4k
description: >
  #32 (FP8 recurrent qkv and z on layers 1-63, nvfp4_blockfit on every other NVFP4 projection, lm_head
  fitted once: RP-KL 0.0760, prefill 14.7K) with every MLP block on nvfp4_gptq. On #93's and #86's maps the same
  change lowered drift by 0.0055 and 0.0104 at identical speed and memory (#102, #104). Formats and kernels are
  #32's, so prefill stays above the GPTQ results with FP8 recurrent paths (#102, #103) at comparable drift.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.gdn.z"
    layers: "1-63"
    format: FP8
modules:
  lm_head: Q4_K
