schema: bittrellis/manifest@2
track: HPC-01
name: gdn-zo-deep-mlp-skip0
description: Test Q4_K on zo-deep GDN units and skip0 MLP units while keeping layer
  0 native for prefill.
authors:
- dato-bitar
default: NVFP4
rules:
- match: L*.gdn.z
  layers: 32-63
  format: Q4_K
- match: L*.gdn.out
  layers: 32-63
  format: Q4_K
- match: L*.mlp
  layers: 1-63
  format: Q4_K
