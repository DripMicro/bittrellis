schema: bittrellis/manifest@2
track: HPC-01
name: gdn-mlp-q4k-skip-layer0
description: >
  Combine Q4_K on recurrent projections and MLP blocks after layer 0.
  Keep the first GDN and MLP blocks NVFP4 to preserve their batched-prefill
  dispatch, and keep every attention projection at baseline to avoid V5's
  task loss. V4 and V6 separately pass holdout and save memory; test whether
  their combined savings survive without V9's first-layer prefill penalty.
  Interactions, task retention and private holdout require evaluator measurement.
authors: [K-3-LT]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-63"
    format: Q4_K
