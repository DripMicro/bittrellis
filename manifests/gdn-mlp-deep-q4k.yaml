schema: bittrellis/manifest@2
track: HPC-01
name: gdn-mlp-deep-q4k
default: NVFP4
rules:
  - match: "L*.gdn.qkv"
    layers: "32-63"
    format: Q4_K
    quantizer: runtime
  - match: "L*.gdn.z"
    layers: "32-63"
    format: Q4_K
    quantizer: runtime
  - match: "L*.gdn.out"
    layers: "32-63"
    format: Q4_K
    quantizer: runtime
  - match: "L*.mlp"
    layers: "32-63"
    format: Q4_K
    quantizer: runtime
