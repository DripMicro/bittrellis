schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-gdn-fp8-all-attn-q4k-lmhead-q4k
description: >
  #102 (RP-KL 0.0688, decode 88.7) already runs the recurrent qkv of layers 1-63 in FP8. This keeps the rest
  of #102 as it is (nvfp4_gptq on every MLP, attention on runtime Q4_K, nvfp4_blockfit on layer 0, lm_head
  fitted once) and moves the recurrent z and out projections of layers 1-63 to FP8 too, so the whole recurrent
  path after layer 0 runs FP8. FP8 on the recurrent path has been the largest single drop in drift on this
  track; V3 shows the cost of all of it (about 83 tok/s decode, about 1 GiB more peak memory). Layer 0 stays
  NVFP4 so the first-layer prefill path is untouched. Expect lower RP-KL than #102 at lower decode.
authors: [Tet-9]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    layers: "1-63"
    format: FP8
modules:
  lm_head: Q4_K
