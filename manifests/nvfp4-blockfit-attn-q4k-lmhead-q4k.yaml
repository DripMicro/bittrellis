schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-blockfit-attn-q4k-lmhead-q4k
description: >
  nvfp4-blockfit-all-lmhead-q4k (#28: 0.0992, decode 95.7, prefill 16,998, 22.02 GiB) with only the 64
  attention projections moved to runtime Q4_K; the recurrent path and the MLP keep nvfp4_blockfit bytes and
  lm_head is fitted once. #86 moved attention and the recurrent qkv together and took drift from 0.0992 to
  0.0858 at 13,627 prefill and 21.67 GiB; attention is 6.6% of the weights against qkv's 9.8%, so this
  map should keep most of the prefill (expected 15,000-15,800) and about a third of that drift gain
  (expected 0.093-0.096), with a little less memory than #28. That is a point between #28 and the FP8
  band map (#74: 0.0896 at 16,280 and 22.39 GiB) that neither covers: lower drift than #28 at nearly its
  prompt speed, and 0.3-0.5 GiB less memory than #74. Attention on Q4_K passed the task guard inside #86
  and #87, unlike the round-to-nearest V5 map it replaces here.
authors: [gold-tree-tech]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: Q4_K
modules:
  lm_head: Q4_K
