schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-lmhead-q4k
description: >
  FP8 on every recurrent (GDN) projection, as in V3, with lm_head stored BF16 so its batch-1 Q4_K is fitted
  once from the original weights instead of twice through NVFP4 (BF16 -> NVFP4 -> Q4_K). Attention and every
  MLP block stay on the shipped NVFP4 bytes, so prefill keeps V3's path instead of the MLP Q4_K path that
  halves it in gdn-fp8-mlp-q4k-skip0. The head is read at every generated token, so fitting it once should
  lower drift beyond V3 (general, multilingual, long context, tools) at V3's speed and memory: a structural
  format change on a unit no merged recipe has measured, the kind that has transferred to the private
  holdout (V3 passes it on its own).
authors: [carlo171112]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    format: FP8
modules:
  lm_head: Q4_K
