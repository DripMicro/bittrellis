schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-fp8-mid24-35-unsloth-mlp0-27-lmhead
description: >
  The recurrent Q4_K map with the FP8 band 24-35 and lm_head fitted once (#66: RP-KL 0.1100, decode 93.4,
  prefill 13.6K, peak 22.08 GiB, holdout PASS), plus the attested calibrated NVFP4 bytes on MLP layers 0-27
  that lowered drift by about 0.009 on top of the band in #65. The calibrated bytes are NVFP4 like the shipped
  ones, so kernels, decode, prefill and memory stay those of #66, about 0.3 GiB below #65; the drift gain of
  the early calibrated MLP should carry over as it did on the shipped recurrent map. Layer 0 of the recurrent
  path, attention and MLP layers 28-63 keep the shipped bytes.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.gdn.*"
    layers: "24-35"
    format: FP8
  - match: "L*.mlp"
    layers: "0-27"
    format: NVFP4
    quantizer: unsloth
modules:
  lm_head: Q4_K
