schema: bittrellis/manifest@2
track: HPC-01
name: gdn-attn-q4k-mlp-early8-mid24-skip0
description: >
  Extend the measured recurrent, attention and middle-MLP Q4_K recipe
  with MLP layers 1-8, retaining native recurrent/MLP layer zero and head.
  Test whether a short early MLP window improves quality while preserving
  performance. This recipe is unmeasured; its gain forecast fails adverse
  stress tests and its task, needle and holdout outcomes are unknown.
authors: [dato-bitar]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-8"
    format: Q4_K
  - match: "L*.mlp"
    layers: "24-47"
    format: Q4_K
