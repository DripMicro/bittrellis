schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-blockfit-gdn-fp8-mid24-35-lmhead-q4k
description: >
  nvfp4_blockfit on every NVFP4 projection with lm_head fitted once from BF16 (#28: RP-KL 0.0992 at the
  shipped speed), plus FP8 on the recurrent projections of layers 24-35 (#63). The two fix different errors:
  blockfit lowers the NVFP4 rounding error of every projection that stays 4-bit, while the mid-depth FP8 band
  is where 8 bits lowered drift most per byte on the shipped map (#63: -0.019 including the head), mostly in
  long context. The band costs about 2.5% decode, 3% prefill and 0.37 GiB, as in #63; everything else runs
  the NVFP4 kernels at #28's speed.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    layers: "24-35"
    format: FP8
modules:
  lm_head: Q4_K
