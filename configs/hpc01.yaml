# HPC-01 — Qwen3.8-27B quantization topology on one RTX 5090, pinned SparkInfer.
# Every number a result depends on is pinned here or in sources.lock.json.
# Changing anything under `evaluation`, `frontier` or `gates` requires a new evaluator epoch.
track: HPC-01
version: 2
title: Qwen3.8-27B × 1× RTX 5090 × SparkInfer 0.5.8

model:
  vocab: 248320
  # Every byte a candidate may contain comes from a source pinned file-by-file in the lock.
  sources_lock: configs/sources.lock.json
  base: {source: base, repo: Qwen/Qwen3.8-27B, revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0, dtype: bfloat16}
  # The shipped checkpoint: every non-searchable tensor, the `baseline` quantizer, and V0.
  shipped: {source: gittensor_nvfp4, repo: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090, revision: 5b7a687fc8211a5d631c8ca6a593dd37eb26ce33}
  # Attested quantizer sources: only maintainers add entries (with file hashes in the lock).
  attested_sources: [gittensor_nvfp4, unsloth_nvfp4]
  aux_files: [chat_template.jinja, generation_config.json, merges.txt, preprocessor_config.json,
              processor_config.json, tokenizer.json, tokenizer_config.json, video_preprocessor_config.json,
              vocab.json, LICENSE]

runtime:
  repo: gittensor-ai-lab/sparkinfer
  commit: b1ed168e3931d22d66dfa0aed3bcc2684f2b8387   # v0.5.8
  cuda: "12.8"
  cmake_args: [-DCMAKE_BUILD_TYPE=Release, -DCMAKE_CUDA_ARCHITECTURES=120, -DBUILD_SERVER=ON, -DBUILD_TESTS=OFF]
  targets: [qwen3_gguf_bench, sparkinfer_server]
  # Every SPARKINFER_* variable is removed before a run; only these are applied. Runtime knobs are
  # part of the runtime, not of the candidate.
  env: {}

hardware: {gpu: NVIDIA GeForce RTX 5090, count: 1, vram_mib: 32607}

evaluation:
  epoch: hpc01-e4
  corpus:
    public: data/corpus/hpc01-public-v2.json     # public development fidelity set
  score:
    reference_topk: 256        # fixed BF16 partition per position: top-256 ids + tail bucket
    env:
      SPARKINFER_DETERMINISTIC: "1"
  performance:
    runs: 2                    # two independent processes; never more
    contexts: [128, 4096, 16384]
    decode_tokens: 512         # longer window instead of more repetitions
    primary_context: 4096
    memory_workload: "peak device memory over one process that loads the model with max_seq 16,384 and runs prefill + 512-token decode at 128, 4,096 and 16,384 context"
  tasks:
    tier: full                 # every SparkInfer bench/quality item (784: IFEval 34, GSM8K 132, MMLU-Pro 298, HumanEval 20, BFCL 300), greedy, thinking off
    server_ctx: 8192
  holdout:
    # Private rotating fidelity set: text never published during its epoch; results are PASS/FAIL.
    rule: >
      PASS if the candidate is audit-valid, its holdout RP-KL is at most gates.rp_kl_max, it keeps every
      holdout needle BF16 retrieves, and -- when its public drift gain over V0 is above the RP-KL floor (the
      gain FG-2 credits) -- its holdout gain over V0 is at least `min_gain_ratio` of the public gain. Both
      gains are relative and section-balanced (frontier.drift), so neither the holdout's lower drift nor one
      public section decides the verdict. (hpc01-e3 compared absolute nats, and only for significant gains.)
    min_gain_ratio: 0.5
  screen:
    # Checks that run before any GPU time (evaluator/guards.py). See docs/guards.md.
    near_copy_max_share: 0.02    # share of searchable weights assigned differently from an earlier PR by another author
    copy_review_after: 3         # near-copies of other authors' PRs per epoch before a maintainer must clear the account
    max_queued_per_author: 3     # an author's PRs waiting at once; later ones wait their turn, never rejected
    peak_gpu_limit_gib: 31.5     # predicted peak above this would OOM on the 32 GB card
    memory_margin_gib: 0.75      # added to the largest measured seed overhead
    quantizer_same_bytes: 0.99   # identical-byte share at which two encoders are the same encoder

frontier:
  # Internal frontier: legal BitTrellis manifests on the pinned runtime. External references never
  # enter dominance or Frontier Gain.
  objectives:
    rp_kl: min                 # Reference-Partition KL vs BF16, public corpus, nats/token
    decode_tps: max            # batch-1 decode tok/s at primary_context, mean of the 2 runs
    prefill_tps: max           # prefill tok/s at primary_context, mean of the 2 runs
    peak_gpu_gib: min          # peak device memory under memory_workload
  # "Materially different" = beyond max(floor, measured spread of either result).
  # RP-KL additionally needs a paired block-bootstrap 95% interval that excludes 0.
  epsilon_floor:
    rp_kl: 0.002               # nats/token
    decode_tps: 0.01           # relative
    prefill_tps: 0.03          # relative
    peak_gpu_gib: 0.10         # GiB
  box:
    rp_kl: [0.0, 0.30]
    decode_tps: [60.0, 120.0]
    prefill_tps: [2000.0, 20000.0]
    peak_gpu_gib: [14.0, 32.0]
  frontier_gain: FG-2
  # hpc01-e4: RP-KL is section-balanced -- V0's RP-KL × the mean, over sections (each short category, and
  # the long streams together), of the candidate's drift relative to V0's there. In hpc01-e3 the plain mean
  # let the public maths stream, where V0 drifts most, decide most of every score.
  drift: section-balanced
  # Measured maintainer candidates that seed the internal frontier. Miners compete against these;
  # resubmitting one earns nothing.
  seeds: results/feasibility/artifacts
  incumbent: V0-baseline-rebuild

gates:
  rp_kl_max: 0.30
  top1_min: 0.80
  task_guard:                  # paired per-question comparison with V0 (exact one-sided McNemar)
    overall_alpha: 0.05        # fail if all 784 questions together show significantly more losses than gains
    suite_alpha: 0.01          # the same test per suite
    min_suite_retention: 0.5   # and never keep fewer than half of V0's passes in any suite
  runtime_correctness: required
  long_context_guard:
    task: needle retrieval (3 codes at 10/50/90% depth), teacher-forced argmax on every code digit
    required_success: {long-8k: 1.0, long-16k: 1.0, long-32k: 1.0}
    counted_only_if_bf16_retrieves: true

# Gittensor pays a merged PR by one trusted label (docs/rewards.md). The bot buckets the measured
# frontier gain (FG-2) into the same eval:* tiers SparkInfer uses, so Gittensor pays them by label.
# FG-2 is computed noise-aware (a result is handicapped by the epsilon floors, and must beat every other
# result beyond noise somewhere), then bucketed. Calibrated to the seeds' noise-aware gains: V13's
# calibrated MLP bytes (0.30%) are L, V0 (0.19%) is M, V4/V1 (0.05/0.04%) are S, V6/V5 are XS.
# A gain below XS -- e.g. a copy of V0 that differs only within noise -- is eval:none.
rewards:
  label_family: eval
  tiers_fg2: {XL: 0.0050, L: 0.0025, M: 0.0012, S: 0.00035, XS: 0.00005}   # minimum FG-2 per tier
  multipliers: {XL: 4.0, L: 2.5, M: 1.5, S: 1.0, XS: 0.5, none: 0.0, REJECT: 0.0}

# External reference points: context only.
external_references:
  R1:
    name: unsloth NVFP4 (hand-tuned mixed NVFP4/FP8)
    kind: sparkinfer
    source: unsloth_nvfp4
    note: runs on the pinned runtime but is not a legal manifest (FP8 attention bytes run as a Q4_K refit)
  R2:
    name: llama.cpp + unsloth UD-Q4_K_M (imatrix dynamic GGUF)
    kind: llama.cpp
    source: unsloth_gguf
    file: Qwen3.8-27B-UD-Q4_K_M.gguf
    llama_cpp_commit: d8df12ebc4592b55dcecf97a32953623d031efdc
  R3:
    name: NVIDIA NVFP4 (FP8 attention + GDN)
    kind: compatibility-boundary
    repo: nvidia/Qwen3.8-27B-NVFP4
    revision: dbb8f445b3145f8a4c18ddc769f032d57d32867c
    reason: per-tensor FP8 scales; the pinned loader accepts only per-row FP8 scales
